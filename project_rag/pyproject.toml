[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-aeronautical-manual"
version = "1.0.0"
description = "RAG application for aeronautical manuals using Weaviate, Ollama, and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cristian Ortega", email = "cristian@example.com"}
]
keywords = ["rag", "langchain", "langgraph", "weaviate", "ollama", "pdf", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy<2",
    "httpx==0.27.0",
    "streamlit==1.39.0",
    "weaviate-client==4.6.3",
    "pypdf==5.1.0",
    "tiktoken==0.7.0",
    "pillow==10.4.0",
    "pdf2image==1.17.0",
    "pytesseract==0.3.13",
    "bcrypt==4.2.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    # LangChain core packages
    "langchain>=0.3.7",
    "langchain-community>=0.3.7",
    "langchain-core>=0.3.17",
    "langchain-text-splitters>=0.3.8",
    # LangGraph - compatible con LangChain 0.3.x
    "langgraph>=0.2.28",
    #Langfuse observability
    "langfuse>=2.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/cristian/rag-aeronautical-manual"
Repository = "https://github.com/cristian/rag-aeronautical-manual"
Issues = "https://github.com/cristian/rag-aeronautical-manual/issues"

[project.scripts]
rag-app = "rag_app.ui.app:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_app*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=rag_app --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true